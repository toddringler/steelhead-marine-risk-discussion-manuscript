<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>@@TITLE@@ · Census review</title>
<style>
:root{color-scheme:light;--ink:#182d38;--muted:#536b76;--line:#ccd9df;--paper:#fff;--accent:#155c55}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#edf2f4;font:16px/1.55 system-ui,sans-serif}header{background:#173d49;color:white;padding:18px max(24px,calc((100vw - 1180px)/2));font-weight:650;letter-spacing:.04em}main{max-width:1180px;margin:32px auto;padding:0 24px 50px}h1{font-size:clamp(28px,4vw,44px);line-height:1.16;letter-spacing:-.03em;margin:12px 0}h2{font-size:23px;margin:0 0 16px}h3{font-size:16px;margin-bottom:8px}.intro{max-width:80ch;color:var(--muted)}.stage{text-transform:uppercase;font-size:12px;font-weight:750;letter-spacing:.08em;color:var(--accent)}section{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px;margin:24px 0}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:24px 0}.card{padding:16px;background:white;border:1px solid var(--line);border-radius:10px}.card strong{display:block;font-size:28px;line-height:1.2}.card span{font-size:12px;color:var(--muted)}.notice,.fixture{padding:16px;border-radius:8px;background:#e4eeed;border-left:4px solid var(--accent);margin:18px 0}.fixture{background:#fff0d2;border-color:#8b5e05;font-weight:750}.errors{border-left:5px solid #a12424;background:#fff2f2}.warnings{border-left:5px solid #957025;background:#fff9eb}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}label{font-size:13px;font-weight:650}input,select,textarea{display:block;width:100%;padding:11px;margin-top:7px;border:1px solid #a8bdc7;border-radius:6px;background:white;color:var(--ink);font:inherit}a{color:#125e93;text-underline-offset:3px}a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #d69722;outline-offset:3px}.change{border:1px solid var(--line);border-radius:8px;margin:12px 0}.change>summary{padding:16px;cursor:pointer;list-style-position:inside}.summary-text{display:block;margin-top:8px;color:var(--muted);padding-left:2px}.badge{display:inline-block;font-size:12px;background:#edf2f4;border-radius:4px;padding:3px 8px;margin:0 8px}.change[data-status="stale"] .badge,.change[data-status="correction requested"] .badge{background:#ffe0d7}.change[data-status="accepted"] .badge{background:#dceee6}.detail{border-top:1px solid var(--line);padding:20px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:20px}pre,code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;overflow-wrap:anywhere;white-space:pre-wrap}pre{padding:14px;background:#f3f6f7;border-radius:6px;max-height:420px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;vertical-align:top;padding:10px;border:1px solid var(--line);overflow-wrap:anywhere}th{background:#f2f6f7}.altered td{background:#fff8df}.muted,footer{color:var(--muted)}footer{font-size:12px;margin-top:30px}.hidden{display:none!important}li{margin:8px 0}@media(max-width:760px){.cards{grid-template-columns:repeat(3,1fr)}.filters,.twocol{grid-template-columns:1fr}main{padding:0 14px 28px}section{padding:16px}.detail{padding:12px}table{font-size:12px}}@media print{body{background:white}header{color:black;background:white}.filters{display:none}section,.change{break-inside:avoid}main{max-width:none}}
button{background:#155c55;color:white;padding:12px 18px;border:0;border-radius:6px;font:inherit;cursor:pointer}.owner-choice{background:#edf6f3;padding:16px;border-radius:8px;margin-bottom:20px}textarea{resize:vertical}button:focus-visible,textarea:focus-visible{outline:3px solid #d69722;outline-offset:3px}</style></head><body><header>STEELHEAD CENSUS / RESEARCH REVIEW</header><main>@@BODY@@<footer>Generated @@GENERATED@@ · Local provisional review · No changes applied to retained data</footer></main>
<script>
(() => {
const search=document.getElementById('search');if(!search)return;
const status=document.getElementById('status'),submission=document.getElementById('submission');
function filter(){const q=search.value.toLowerCase().trim();let visible=0;const changes=[...document.querySelectorAll('.change')];for(const item of changes){const show=(!q||item.dataset.search.includes(q))&&(!status.value||item.dataset.status===status.value)&&(!submission.value||item.dataset.submission===submission.value);item.classList.toggle('hidden',!show);if(show)visible++;}document.getElementById('visible-count').textContent=`Showing ${visible} of ${changes.length} proposed changes`;}
for(const control of [search,status,submission]){control.addEventListener('input',filter);control.addEventListener('change',filter);}filter();
const context=JSON.parse(document.getElementById('decision-context').textContent);
document.getElementById('download-decisions').addEventListener('click',()=>{
 const message=document.getElementById('decision-message');
 const owner=document.getElementById('owner-name').value.trim();
 const decisions=[...document.querySelectorAll('.decision-choice')].filter(x=>x.value).map(x=>({change_id:x.dataset.changeId,choice:x.value,comment:document.getElementById('comment-'+x.dataset.changeId).value.trim()}));
 if(!owner){message.textContent='Please enter your name before downloading.';return;}
 if(!decisions.length){message.textContent='Choose at least one proposal before downloading.';return;}
 if(decisions.some(x=>x.choice==='request changes'&&!x.comment)){message.textContent='Please describe the requested changes in a comment.';return;}
 const bundle={schema_version:1,type:'census-owner-decisions',owner_name:owner,exported_at:new Date().toISOString(),context,decisions};
 const blob=new Blob([JSON.stringify(bundle,null,2)+'\n'],{type:'application/json'});
 const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='owner-decisions.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 message.textContent='Downloaded '+decisions.length+' decisions. Give owner-decisions.json to the steward with your instruction to use it. Nothing has been applied to the repository.';
});
})();
</script></body></html>
